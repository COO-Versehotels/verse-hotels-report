name: TMP security check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U=https://hgbqecsmhrzlavsjwlwq.supabase.co; K=sb_publishable_KeAmOu9ex8r1PDRI1MRMsQ_40uiEkbM
          H=(-H "apikey: $K" -H "Authorization: Bearer $K" -H "Content-Type: application/json")
          mkdir out; o=out/result.txt
          echo "1 baca daftar PIN langsung: $(curl -s -o /dev/null -w '%{http_code}' "${H[@]}" "$U/rest/v1/report_users?select=*") $(curl -s "${H[@]}" "$U/rest/v1/report_users?select=*" | head -c 120)" >> $o
          echo "2 ubah status device langsung: $(curl -s -w ' %{http_code}' -X PATCH "${H[@]}" "$U/rest/v1/device_approvals?id=gt.0" -d '{"status":"approved"}' | head -c 150)" >> $o
          echo "3 baca tabel PIN cadangan: $(curl -s "${H[@]}" "$U/rest/v1/role_pin_fallback?select=*" | head -c 120)" >> $o
          echo "4 device_check HP baru: $(curl -s -X POST "${H[@]}" "$U/rest/v1/rpc/device_check" -d '{"p_device_id":"test-live-0001","p_user_agent":"gh"}')" >> $o
          echo "5 PIN salah: $(curl -s -X POST "${H[@]}" "$U/rest/v1/rpc/verify_pin" -d '{"p_role":"HM Verse Luxe","p_pin":"0000"}')" >> $o
          echo "6 PIN benar tapi HP belum approve: $(curl -s -X POST "${H[@]}" "$U/rest/v1/rpc/verify_pin" -d '{"p_role":"HM Verse Luxe","p_pin":"1020","p_device_id":"test-live-0001"}')" >> $o
          echo "7 admin tanpa token: $(curl -s -X POST "${H[@]}" "$U/rest/v1/rpc/admin_users_list" -d '{"p_token":"palsu"}' | head -c 120)" >> $o
          P=$(curl -s https://verse-hotels-report.vercel.app/)
          echo "8 web live pakai RPC: $(echo "$P" | grep -c 'rpc/verify_pin\|_rpc(.verify_pin') | PIN tertulis (ROLE_PINS): $(echo "$P" | grep -c 'ROLE_PINS')" >> $o
          cd out && git init -q && git checkout -q -b tmp-result && git config user.email a@b.c && git config user.name bot && git add . && git commit -qm r
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tmp-result
