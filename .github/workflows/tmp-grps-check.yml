name: TMP GRPS check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for r in "HM%20Verse%20Luxe" "HM%20Verse%20Lite" "HM%20Verse%20Cirebon" "HM%20Oak%20Tree"; do
            echo "== $r" >> result.txt
            curl -s -m 60 -w "\nHTTP %{http_code} time %{time_total}s\n" "https://verse-hotels-report.vercel.app/api/grps?role=$r" | head -c 700 >> result.txt
            echo >> result.txt
          done
          curl -s -o /dev/null -w "HTML page HTTP %{http_code}\n" https://verse-hotels-report.vercel.app/ >> result.txt
          git init -q && git checkout -q -b tmp-grps-result
          git config user.email a@b.c && git config user.name bot
          git add . && git commit -qm result
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tmp-grps-result
