name: TMP GRPS check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          mkdir out && cd out
          for r in "HM%20Verse%20Lite" "HM%20Verse%20Luxe" "HM%20Verse%20Cirebon" "HM%20Oak%20Tree"; do
            echo "== $r" >> result.txt
            curl -s -m 60 "https://verse-hotels-report.vercel.app/api/grps?role=$r&nocache=$RANDOM$RANDOM" | python3 -c "import json,sys; d=json.load(sys.stdin); print('success',d.get('success'),'| MTD',d.get('collectionRateMTD'),'| err',d.get('error'))" >> result.txt 2>&1
          done
          git init -q && git checkout -q -b tmp-result && git config user.email a@b.c && git config user.name bot && git add . && git commit -qm r
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tmp-result
