name: TMP GRPS check
on: workflow_dispatch
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U='https://script.google.com/macros/s/AKfycbz3b0dZeU2TMYT2x9V9SjhE8rlK5aDDhJ1hM2OnBrX1KawBpFkBCSu7kqF5pbT2eGWSyQ/exec?key=verse-grps-rating-2026&role=HM%20Verse%20Luxe'
          mkdir out && cd out
          curl -sL -D headers.txt -o body.txt -H 'Origin: https://verse-hotels-report.vercel.app' "$U" || true
          head -c 3000 body.txt > body_head.txt; rm body.txt
          git init -q && git checkout -q -b tmp-grps-result
          git config user.email a@b.c && git config user.name bot
          git add . && git commit -qm result
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tmp-grps-result
