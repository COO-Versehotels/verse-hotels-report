name: TMP push send
on: workflow_dispatch
permissions:
  contents: write
jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - env:
          PUSH_AUTH: ${{ secrets.PUSH_SYSTEM_SECRET }}
        run: |
          mkdir out; o=out/r-$GITHUB_RUN_ID.txt
          echo "diag: $(curl -s -X POST https://verse-hotels-report.vercel.app/api/send-push -H 'Content-Type: application/json' -d "{\"auth\":\"$PUSH_AUTH\",\"diag\":true}" | python3 -c "import json,sys;d=json.load(sys.stdin);print(d.get('raw',{}).get('length'),d.get('normalized',{}).get('parse'))")" >> $o
          echo "kirim: $(curl -s -X POST https://verse-hotels-report.vercel.app/api/send-push -H 'Content-Type: application/json' -d "{\"auth\":\"$PUSH_AUTH\",\"target\":\"role\",\"targetValue\":\"COO\",\"title\":\"✅ Tes Notifikasi Verse Apps\",\"body\":\"Halo Pak Ian, notifikasi sudah berfungsi normal.\"}")" >> $o
          cd out && git init -q && git checkout -q -b tmp-d-$GITHUB_RUN_ID && git config user.email a@b.c && git config user.name bot && git add . && git commit -qm r
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" tmp-d-$GITHUB_RUN_ID
